<!doctype html><html><body><div id="host"></div><pre id="out"></pre><script>
fetch('raw/skel-front-nolabel.svg').then(r=>r.text()).then(t=>{document.getElementById('host').innerHTML=t;const svg=document.querySelector('svg');const o={};
for(const id of ['TarsalsLeft','MetatarsalsLeft','PhalangesFootLeft','TarsalsRight','MetatarsalsRight','PhalangesFootRight','FibulaRight','TibiaRight','FemurLeft','PelvicGirdle','Scapula','Coccyx','Sacrum','LumbarVertebrae','ThoracicVertebrae','CervicalVertebrae','Skull','Mandible','Cranium','Manubrium','ClavicleRight','ClavicleLeft','HumerusLeft','RadiusLeft','UlnaLeft','HumerusRight','UlnaRight','RadiusRight','CarpalsLeft','MetacarpalsLeft','PhalangesLeft','CarpalsRight','PhalangesRight','MetacarpalsRight','Sternum','FibulaLeft','TibiaLeft','PatellaRight','PatellaLeft']){const e=document.getElementById(id);if(!e){o[id]=null;continue;}const b=e.getBBox();const m=e.getCTM();const p=(x,y)=>{const q=svg.createSVGPoint();q.x=x;q.y=y;const r=q.matrixTransform(m);return [Math.round(r.x*10)/10,Math.round(r.y*10)/10]};o[id]=[...p(b.x,b.y),...p(b.x+b.width,b.y+b.height)];}
const vb=svg.viewBox.baseVal;o._vb=[vb.x,vb.y,vb.width,vb.height];o._ctmroot=svg.getScreenCTM()?1:0;document.getElementById('out').textContent=JSON.stringify(o);});
</script></body></html>
